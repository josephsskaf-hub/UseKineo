<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K18 partial — PT/ES script launchers</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#070708;color:#f5f5f7;font-family:Inter,Arial,sans-serif}main{max-width:1380px;margin:auto;padding:28px}.intro{margin-bottom:24px}.intro h1{font-size:28px;margin:0 0 8px}.intro p{color:#a1a1a6;margin:0;line-height:1.5}.group{margin:28px 0 42px}.group>h2{font-size:17px;letter-spacing:.08em;text-transform:uppercase;color:#2997ff}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}.shot{border:1px solid #2a2a2d;border-radius:20px;overflow:hidden;background:#000}.shot.mobile{max-width:390px;justify-self:center;width:100%}.tag{padding:8px 12px;background:#1a1a1e;color:#d2d2d7;font-size:11px;font-weight:800;letter-spacing:.1em}.page{padding:25px 20px 28px}.badge{display:inline-block;color:#2997ff;border:1px solid rgba(41,151,255,.4);background:rgba(41,151,255,.12);border-radius:999px;padding:6px 10px;font-size:10px;font-weight:850;text-transform:uppercase}.hero{font-size:26px;line-height:1.08;margin:15px 0 10px}.lead{font-size:14px;line-height:1.55;color:#9a9aa0;margin:0 0 18px}.form{background:#131316;border:1px solid #2a2a2d;border-radius:17px;padding:15px}.label{font-size:12px;font-weight:750;margin-bottom:8px}.textarea{height:64px;border:1px solid #3b3b40;border-radius:12px;color:#75757b;background:#0b0b0d;padding:11px;font-size:11px;line-height:1.4}.button{margin-top:10px;background:#2997ff;color:#fff;border-radius:11px;padding:10px;text-align:center;font-weight:850;font-size:12px}.note{color:#77777d;font-size:9px;line-height:1.45;margin-top:9px}.script{margin-top:23px;padding:18px 16px;border:1px solid rgba(41,151,255,.42);border-radius:18px;background:linear-gradient(145deg,rgba(41,151,255,.14),rgba(19,19,22,.94) 56%)}.eyebrow{color:#2997ff;font-size:9px;font-weight:850;letter-spacing:.1em;text-transform:uppercase}.script h3{font-size:19px;margin:7px 0}.script .desc{color:#a1a1a6;font-size:11px;line-height:1.5;margin:0 0 13px}.missing{margin-top:22px;border:1px dashed #4a4a50;border-radius:16px;padding:18px;color:#77777d;text-align:center;font-size:12px}.before .script,.after .missing{display:none}@media(max-width:760px){main{padding:16px}.pair{grid-template-columns:1fr}.hero{font-size:22px}}
  </style>
</head>
<body>
<main>
  <div class="intro">
    <h1>K18 parcial — launcher de roteiro em PT-BR e espanhol</h1>
    <p>Comparação estática do trecho tocado. A rota e o gerador por tópico continuam; o “depois” acrescenta uma escolha separada para roteiro pronto. DE/FR e prova narrada não são reivindicados.</p>
  </div>
  <div id="previews"></div>
</main>
<script>
const locales={
  pt:{name:'PT-BR',badge:'Gerador de Shorts com IA',hero:'Crie um Short sem aparecer — grátis',lead:'Digite uma ideia e o Kineo gera o Short vertical completo: roteiro, narração em português, cenas e legendas.',topicLabel:'Sobre o que vai ser o seu Short grátis?',topicPlaceholder:'Ex.: a ilha proibida que aparece no mapa',topicButton:'Criar meu Short grátis',eyebrow:'Ou, se você já tem o roteiro',heading:'Já tem um roteiro? Cole aqui.',desc:'Seu roteiro segue pelo cadastro e chega ao Kineo com alvo de 35 segundos. O Kineo usa Seedance se o saldo do teste ativo cobrir; senão, usa Fast. Você não precisa colar de novo.',scriptLabel:'Cole o roteiro que você já tem',scriptPlaceholder:'Cole até 1.000 caracteres. Pode manter rótulos como Voiceover:, Narração:, Visual:, Câmera:, cenas e marcações de tempo.',scriptButton:'Transformar este roteiro em Short →',note:'Com pelo menos dois rótulos de fala, como Voiceover:, Narração: ou Fala:, o Kineo lê somente esses blocos; direções de produção reconhecidas ficam fora da voz. A pontuação pode mudar para ajustar o ritmo, mas a sequência das palavras não.'},
  es:{name:'ES',badge:'Generador de Shorts con IA',hero:'Crea un Short sin aparecer — gratis',lead:'Escribe una idea y Kineo genera el Short vertical completo: guion, narración en español, escenas y subtítulos.',topicLabel:'¿Sobre qué será tu Short gratis?',topicPlaceholder:'Ej.: la isla prohibida que aparece en el mapa',topicButton:'Crear mi Short gratis',eyebrow:'O, si ya tienes el guion',heading:'¿Ya tienes un guion? Pégalo aquí.',desc:'Tu guion se conserva durante el registro y llega a Kineo con un objetivo de 35 segundos. Kineo usa Seedance si el saldo de la prueba activa alcanza; si no, usa Fast. No tendrás que pegarlo otra vez.',scriptLabel:'Pega el guion que ya tienes',scriptPlaceholder:'Pega hasta 1.000 caracteres. Puedes conservar etiquetas como Voiceover:, Narración:, Visual:, Cámara:, escenas y códigos de tiempo.',scriptButton:'Convertir este guion en un Short →',note:'Con al menos dos etiquetas de voz, como Voiceover:, Narración: o Diálogo:, Kineo lee solo esos bloques; las indicaciones de producción reconocidas quedan fuera de la voz. Puede ajustar la puntuación para el ritmo, pero no cambia la secuencia de palabras.'}
};
function form(label,placeholder,button,note=''){return `<div class="form"><div class="label">${label}</div><div class="textarea">${placeholder}</div><div class="button">${button}</div>${note?`<div class="note">${note}</div>`:''}</div>`}
function page(x,after,mobile){return `<article class="shot ${mobile?'mobile':''} ${after?'after':'before'}"><div class="tag">${after?'DEPOIS':'ANTES'} · ${mobile?'MOBILE 360':'DESKTOP'}</div><div class="page"><span class="badge">${x.badge}</span><h3 class="hero">${x.hero}</h3><p class="lead">${x.lead}</p>${form(x.topicLabel,x.topicPlaceholder,x.topicButton)}<div class="missing">Nenhum caminho separado para quem já chega com roteiro.</div><section class="script"><div class="eyebrow">${x.eyebrow}</div><h3>${x.heading}</h3><p class="desc">${x.desc}</p>${form(x.scriptLabel,x.scriptPlaceholder,x.scriptButton,x.note)}</section></div></article>`}
let html='';for(const mobile of [false,true])for(const x of Object.values(locales)){html+=`<section class="group"><h2>${x.name} · ${mobile?'mobile':'desktop'}</h2><div class="pair">${page(x,false,mobile)}${page(x,true,mobile)}</div></section>`}document.querySelector('#previews').innerHTML=html;
</script>
</body>
</html>
