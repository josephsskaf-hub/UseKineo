<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R29 — Brief before signup</title>
<style>*{box-sizing:border-box}body{margin:0;background:#08080b;color:#f5f5f7;font-family:Arial,sans-serif;padding:24px}.pair{display:flex;align-items:flex-start;justify-content:center;gap:24px;margin-bottom:32px}.frame{width:660px;border:1px solid #38383d;border-radius:18px;padding:18px}.mobile{width:390px}.label{color:#8ad5ff;font-size:12px;letter-spacing:.1em;font-weight:800;margin-bottom:16px}.card{padding:22px;border:1px solid #2997ff73;border-radius:18px;background:linear-gradient(145deg,#2997ff1f,#ffffff06)}.eyebrow{color:#2997ff;font-size:12px;font-weight:800;margin:0 0 8px;text-transform:uppercase}h2{font-size:22px;margin:0 0 8px}p{color:#d2d2d7;line-height:1.6;font-size:15px}.field{display:block;border:1px solid #3a3a3d;background:#0b0b0d;border-radius:12px;padding:13px 14px;margin:8px 0 18px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:10px 0 18px}.mobile .choices{grid-template-columns:1fr}.option{border:1px solid #343438;border-radius:12px;padding:12px;font-size:13px;background:#161618}.option:first-child{border-color:#2997ff;background:#2997ff24}.option small{display:block;color:#99999f;font-size:12px;line-height:1.45;margin-top:5px}.muted{color:#99999f;font-size:12px;line-height:1.5}.brief{background:#0b0b0d;border:1px solid #3a3a3d;border-radius:12px;padding:14px;line-height:1.6;font-size:14px;color:#d2d2d7}.copy{display:inline-block;border:1px solid #54545a;border-radius:10px;padding:10px 16px;font-size:13px;font-weight:bold;margin:8px 0 20px}.cta{background:#f5f5f7;color:#000;border-radius:999px;text-align:center;padding:14px 16px;font-size:15px;font-weight:900;margin-top:16px}label{font-size:13px;font-weight:800}</style>
<div class="pair" id="desktop"></div><div class="pair" id="mobile"></div>
<template id="base"><section class="card"><div class="eyebrow">Put the policy into practice</div><h2>Build an original angle for your next Short</h2><p class="intro"></p><label>1. What is your video about?</label><div class="field">dream memory</div><label>2. What should the viewer get from it?</label><div class="choices"><div class="option">◉ Explain the surprise<small>Reveal the counterintuitive reason behind the topic.</small></div><div class="option">○ Myth vs. fact<small>Challenge a common belief with evidence and context.</small></div><div class="option">○ Tell a short story<small>Use tension, one turning point and a clear payoff.</small></div><div class="option">○ Give a useful breakdown<small>Turn the topic into steps the viewer can use.</small></div></div><div class="preview"></div><div class="cta">Create this original Short →</div><p class="muted">Your recipe stays attached through signup. The free Fast workflow requires no card. Original structure helps, but no tool can guarantee YouTube monetization.</p></section></template>
<script>for(const size of ['desktop','mobile'])for(const after of [false,true]){const frame=document.createElement('section');frame.className='frame '+(size==='mobile'?'mobile':'');frame.innerHTML='<div class="label">'+(after?'AFTER':'BEFORE')+' · '+size.toUpperCase()+'</div>';frame.append(document.querySelector('#base').content.cloneNode(true));frame.querySelector('.intro').textContent=after?'Add your topic and choose what the viewer should get from it. Read and copy your brief here, then continue to Kineo when you are ready to make the video.':'YouTube does not reward an AI label; it rewards a reason to watch. Add your topic, choose the value you want to give the viewer, and Kineo will carry that recipe into a free first draft.';if(after)frame.querySelector('.preview').innerHTML='<label>Your video brief — ready to keep</label><p class="muted">This is the direction for your video, not a finished narration. The same text goes with you through signup.</p><div class="brief">Create an original 45-second faceless YouTube Short about: dream memory. Open with a surprising claim, explain the counterintuitive reason behind it, and end with one useful takeaway. Use a distinct angle, concrete details, and natural language. Do not claim that monetization is guaranteed.</div><div class="copy">Copy brief</div>';document.getElementById(size).append(frame)}</script></html>
