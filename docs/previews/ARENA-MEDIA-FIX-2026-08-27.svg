  <rect class="bg" width="1440" height="1760"/>
  <text x="54" y="62" class="blue heavy small" letter-spacing="2">KINEO · ORGANIC ENGINE ARENA · 27 AUG 2026</text>
  <text x="54" y="108" class="white heavy" font-size="34">Seven real engines, honest trade-offs, one organic landing page.</text>
  <text x="54" y="141" class="muted" font-size="16">Static before/after proof: all media cards, final subscription band, FAQ correction and explicit mobile layout.</text>

  <rect x="54" y="190" width="300" height="710" rx="20" class="panel"/>
  <text x="76" y="224" class="red heavy small" letter-spacing="1.5">BEFORE · BROKEN / RISKY</text>
  <rect x="76" y="244" width="256" height="230" rx="14" fill="#12131a" stroke="#50444c" stroke-dasharray="8 7"/>
  <text x="204" y="344" text-anchor="middle" class="red heavy" font-size="38">404</text>
  <text x="204" y="372" text-anchor="middle" class="muted small">Kineo 1 preview missing</text>
  <text x="76" y="515" class="white bold small">The old page could:</text>
  <text x="76" y="548" class="muted small">• autoplay a 48 MB render</text>
  <text x="76" y="575" class="muted small">• hardcode posters outside allowlist</text>
  <text x="76" y="602" class="muted small">• promise “nine-image consistency”</text>
  <text x="76" y="629" class="muted small">• call Kling 3 the only lip-sync engine</text>
  <text x="76" y="656" class="muted small">• lose final CTA attribution via /free</text>
  <rect x="76" y="700" width="256" height="152" rx="12" fill="#17131a" stroke="#4b353c"/>
  <text x="92" y="728" class="red bold small">Commercial consequence</text>
  <text x="92" y="756" class="muted small">A comparison page can win a search</text>
  <text x="92" y="778" class="muted small">and still lose trust or speed before</text>
  <text x="92" y="800" class="muted small">the visitor reaches the 25-credit trial.</text>

  <rect x="374" y="190" width="1012" height="710" rx="20" class="panel"/>
  <text x="394" y="224" class="green heavy small" letter-spacing="1.5">AFTER · SEVEN ALLOWLISTED, CLICK-TO-PLAY PREVIEWS</text>

