    <rect x="404" y="254" width="86" height="24" rx="6" class="badge"/><text x="414" y="270" class="white heavy tiny">OMNI FLASH</text>
    <text x="408" y="411" class="white bold small">Physical realism</text><text x="408" y="434" class="muted tiny">Metal, glass, fire and impact.</text><text x="408" y="457" class="amber tiny">Trade-off: 10s scene cap.</text><text x="408" y="488" class="muted tiny">150 credits / film</text>
  </g>
  <g>
    <rect x="640" y="244" width="232" height="264" rx="12" class="card"/>
    <image href="file:///C:/Users/josep/OneDrive/%C3%81rea%20de%20Trabalho/Usekineo/.claude/worktrees/codex-growth-1839/public/posters/hero-veo31.webp" x="640" y="244" width="232" height="142" preserveAspectRatio="xMidYMid slice" clip-path="url(#c2)"/>
    <rect x="650" y="254" width="72" height="24" rx="6" class="badge"/><text x="660" y="270" class="white heavy tiny">VEO 3.1</text>
    <text x="654" y="411" class="white bold small">Film-like light</text><text x="654" y="434" class="muted tiny">Landscapes and interiors.</text><text x="654" y="457" class="amber tiny">More than H3/Seedance/K2.5.</text><text x="654" y="488" class="muted tiny">100 credits / film</text>
  </g>
  <g>
    <rect x="886" y="244" width="232" height="264" rx="12" class="card"/>
    <image href="file:///C:/Users/josep/OneDrive/%C3%81rea%20de%20Trabalho/Usekineo/.claude/worktrees/codex-growth-1839/public/posters/hero-kling3.webp" x="886" y="244" width="232" height="142" preserveAspectRatio="xMidYMid slice" clip-path="url(#c3)"/>
    <rect x="896" y="254" width="72" height="24" rx="6" class="badge"/><text x="906" y="270" class="white heavy tiny">KLING 3</text>
    <text x="900" y="411" class="white bold small">Voice + lip sync</text><text x="900" y="434" class="muted tiny">Dialogue scenes with native voice.</text><text x="900" y="457" class="amber tiny">Trade-off: premium tier.</text><text x="900" y="488" class="muted tiny">150 credits / film</text>
  </g>
  <g>
    <rect x="1132" y="244" width="232" height="264" rx="12" class="card"/>
