    <rect x="650" y="540" width="94" height="24" rx="6" class="badge"/><text x="660" y="556" class="white heavy tiny">SEEDANCE 1.5</text>
    <text x="654" y="697" class="white bold small">Fast full AI film</text><text x="654" y="720" class="muted tiny">Dependable volume engine.</text><text x="654" y="743" class="amber tiny">Simpler premium motion.</text><text x="654" y="774" class="muted tiny">25 credits / film</text>
  </g>
  <g>
    <rect x="886" y="530" width="232" height="264" rx="12" class="card"/>
