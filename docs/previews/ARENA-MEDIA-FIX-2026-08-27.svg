    <rect x="1142" y="254" width="96" height="24" rx="6" class="badge"/><text x="1152" y="270" class="white heavy tiny">MINIMAX H3</text>
    <text x="1146" y="411" class="white bold small">Lower-cost dialogue</text><text x="1146" y="434" class="muted tiny">Directed talking-character scenes.</text><text x="1146" y="457" class="amber tiny">One anchor; identity may drift.</text><text x="1146" y="488" class="muted tiny">25 credits / film</text>
  </g>
  <g>
    <rect x="394" y="530" width="232" height="264" rx="12" class="card"/>
    <image href="file:///C:/Users/josep/OneDrive/%C3%81rea%20de%20Trabalho/Usekineo/.claude/worktrees/codex-growth-1839/public/posters/hero-kling25.webp" x="394" y="530" width="232" height="142" preserveAspectRatio="xMidYMid slice" clip-path="url(#c5)"/>
    <rect x="404" y="540" width="82" height="24" rx="6" class="badge"/><text x="414" y="556" class="white heavy tiny">KLING 2.5</text>
    <text x="408" y="697" class="white bold small">Cinematic movement</text><text x="408" y="720" class="muted tiny">Dolly, crane and orbit shots.</text><text x="408" y="743" class="amber tiny">No directed lip-sync.</text><text x="408" y="774" class="muted tiny">50 credits / film</text>
  </g>
  <g>
    <rect x="640" y="530" width="232" height="264" rx="12" class="card"/>
