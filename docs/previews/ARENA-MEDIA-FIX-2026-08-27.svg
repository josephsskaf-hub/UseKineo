    <rect x="896" y="540" width="70" height="24" rx="6" class="badge"/><text x="906" y="556" class="white heavy tiny">KINEO 1</text>
    <text x="900" y="697" class="white bold small">Real footage + captions</text><text x="900" y="720" class="muted tiny">Reality cut to narration.</text><text x="900" y="743" class="amber tiny">No imagined spectacle.</text><text x="900" y="774" class="muted tiny">5 credits / film</text>
  </g>
  <rect x="1132" y="530" width="232" height="264" rx="12" class="offer"/>
  <text x="1248" y="586" text-anchor="middle" class="white heavy" font-size="18">One subscription.</text>
  <text x="1248" y="610" text-anchor="middle" class="white heavy" font-size="18">All seven.</text>
  <text x="1248" y="654" text-anchor="middle" class="muted small">Plans from $7/month</text>
  <text x="1248" y="678" text-anchor="middle" class="muted small">25 free credits · no card</text>
  <rect x="1170" y="712" width="156" height="40" rx="10" class="cta"/><text x="1248" y="737" text-anchor="middle" class="white heavy small">Render free →</text>
  <rect x="394" y="814" width="970" height="66" rx="12" fill="#11151f" stroke="#2c3343"/>
  <text x="414" y="840" class="white bold small">FAQ corrected:</text>
  <text x="414" y="862" class="muted small">Kling 3 and MiniMax H3 both support directed lip-sync; H3 uses one planned anchor per scene and identity can still drift.</text>

  <text x="54" y="958" class="blue heavy small" letter-spacing="1.5">WHAT THE FIX GUARANTEES</text>
  <g>
    <rect x="54" y="980" width="316" height="106" rx="14" class="panel"/><text x="74" y="1011" class="white bold small">Performance contract</text><text x="74" y="1037" class="muted small">7 local previews · each &lt;2 MB</text><text x="74" y="1061" class="muted small">preload none · no autoplay / loop</text>
    <rect x="386" y="980" width="316" height="106" rx="14" class="panel"/><text x="406" y="1011" class="white bold small">Media allowlist</text><text x="406" y="1037" class="muted small">Poster + preview resolve from one</text><text x="406" y="1061" class="muted small">founder-approved source of truth.</text>
    <rect x="718" y="980" width="316" height="106" rx="14" class="panel"/><text x="738" y="1011" class="white bold small">Commercial truth</text><text x="738" y="1037" class="muted small">Price and trial grant come from</text><text x="738" y="1061" class="muted small">canonical helpers, not JSX literals.</text>
    <rect x="1050" y="980" width="336" height="106" rx="14" class="panel"/><text x="1070" y="1011" class="white bold small">Attribution preserved</text><text x="1070" y="1037" class="muted small">Final CTA goes directly to Studio</text><text x="1070" y="1061" class="muted small">with Arena campaign parameters.</text>
  </g>

  <rect x="54" y="1110" width="900" height="520" rx="20" class="panel"/>
  <text x="78" y="1148" class="green heavy small" letter-spacing="1.5">EXPLICIT MOBILE COMPARISON</text>
  <text x="78" y="1184" class="white heavy" font-size="25">The corrected experience survives phone width.</text>
  <text x="78" y="1222" class="muted small">• Real poster frames remain legible; videos require intentional play.</text>
  <text x="78" y="1252" class="muted small">• Strength, trade-off, credit cost and engine CTA stay together.</text>
  <text x="78" y="1282" class="muted small">• The subscription band and corrected FAQ remain in flow.</text>
  <text x="78" y="1312" class="muted small">• No hidden desktop-only claim or action is introduced.</text>
  <rect x="78" y="1360" width="820" height="220" rx="16" fill="#0c1928" stroke="#285981"/>
  <text x="106" y="1398" class="white heavy" font-size="20">Why this can acquire subscribers organically</text>
  <text x="106" y="1436" class="muted small">A searcher asking “Veo vs Kling” sees real output, honest constraints and exact credit cost.</text>
  <text x="106" y="1465" class="muted small">The CTA carries the chosen engine into Studio, so the trial starts with the visitor’s intent intact.</text>
  <text x="106" y="1494" class="muted small">The $7 / 25-credit offer is visible only after the comparison has earned the ask.</text>
  <rect x="106" y="1524" width="190" height="38" rx="9" class="cta"/><text x="201" y="1548" text-anchor="middle" class="white heavy small">Render your script free →</text>

  <rect x="984" y="1110" width="342" height="570" rx="38" fill="#020203" stroke="#30333f" stroke-width="10"/>
  <text x="1015" y="1150" class="blue heavy tiny" letter-spacing="1.4">KINEO · ENGINE ARENA</text>
  <text x="1015" y="1190" class="white heavy" font-size="23">Seven engines.</text><text x="1015" y="1217" class="blue heavy" font-size="23">Real renders.</text>
  <image href="file:///C:/Users/josep/OneDrive/%C3%81rea%20de%20Trabalho/Usekineo/.claude/worktrees/codex-growth-1839/public/posters/36a04f7b-65f7-42d9-a2ab-198b5a7f115e.jpg" x="1015" y="1240" width="280" height="174" preserveAspectRatio="xMidYMid slice" clip-path="url(#m1)"/>
  <rect x="1025" y="1250" width="88" height="24" rx="6" class="badge"/><text x="1035" y="1266" class="white heavy tiny">OMNI FLASH</text>
  <rect x="1015" y="1416" width="280" height="78" rx="10" class="card"/><text x="1031" y="1444" class="white bold small">Physical realism</text><text x="1031" y="1468" class="amber tiny">10s scenes · 150 credits</text>
  <rect x="1015" y="1510" width="280" height="126" rx="12" class="offer"/><text x="1155" y="1545" text-anchor="middle" class="white heavy" font-size="17">One plan. All seven.</text><text x="1155" y="1572" text-anchor="middle" class="muted small">$7/month · 25 free credits</text><rect x="1081" y="1588" width="148" height="32" rx="8" class="cta"/><text x="1155" y="1609" text-anchor="middle" class="white heavy tiny">Render free →</text>
  <text x="720" y="1720" text-anchor="middle" class="muted tiny">Static audit artifact · actual founder-approved poster frames from the repository · desktop and mobile</text>
