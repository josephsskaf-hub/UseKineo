# PLATAFORMA-PORTAO-1111 — os testes saem do PC do fundador e rodam aqui.
# Dois jobs:
#   · "Portão de entrega" — tipos (tsc) + os guardiões confiáveis de dinheiro, cobrança, login e entrega do vídeo
#     (lista em scripts/ci/portao.txt). Roda em TODO push de qualquer branch e em todo PR. NÃO para no primeiro
#     vermelho: roda a lista inteira e mostra a tabela no resumo da execução. Ainda NÃO segura o deploy da Vercel
#     (isso só depois de 5 verdes seguidos na main — docs/PLATAFORMA-PUBLICAR-EM-DOIS-TEMPOS-2026-11-11.md).
#   · "Diagnóstico — avisa, não bloqueia" — o resto do Guardião antigo (scripts/ci/diagnostico.txt). Roda no push
#     da main e à mão; vermelho aqui é aviso, não trava nada.
# Regra: teste novo nasce no diagnóstico; sobe ao portão só depois de 5 verdes seguidos na main; teste do portão que
# ficar vermelho sem defeito real desce no mesmo dia. Nenhum segredo de produção é passado; tudo offline.
name: Guardião
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guardiao-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  portao:
    name: Portão de entrega
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tipos — npx tsc --noEmit
        run: npx tsc --noEmit --incremental false
      - name: Guardiões do portão — dinheiro, cobrança, login e entrega
        if: success() || failure()
        run: bash scripts/ci/rodar-lista.sh scripts/ci/portao.txt

  diagnostico:
    name: Diagnóstico — avisa, não bloqueia
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Guardiões em diagnóstico
        continue-on-error: true
        run: bash scripts/ci/rodar-lista.sh scripts/ci/diagnostico.txt
      - name: Amostra — Postgres isolado e mutantes SQL
        continue-on-error: true
        run: |
          npm install --prefix "$RUNNER_TEMP/kineo-sample-sql" --ignore-scripts --no-audit --no-fund --package-lock=false @electric-sql/pglite@0.5.11
          node scripts/test-support/ads-amostra-data-sql-2410.cjs "$RUNNER_TEMP/kineo-sample-sql/node_modules/@electric-sql/pglite" supabase/migrations/20261024175246_ads_escolha_sample.sql --mutants
