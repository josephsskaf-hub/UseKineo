<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kineo — uma identidade para mais mercados</title><style>@font-face{font-family:Manrope;font-weight:200 800;font-display:swap;src:url('/design/business-ads-20260924/manrope-latin.woff2')}@font-face{font-family:Manrope;font-weight:200 800;font-display:swap;src:url('/design/business-ads-20260924/manrope-greek.woff2');unicode-range:U+370-3FF}*{box-sizing:border-box}body{margin:0;font:12px Manrope,Arial;background:#e9eae7;color:#25282d;height:100vh;display:flex;flex-direction:column}header{background:#fff;padding:15px 22px 12px;border-bottom:1px solid #d8dcdf}.top{display:flex;justify-content:space-between;align-items:center;gap:15px}.top strong{font-size:16px;letter-spacing:-.4px}.top a{color:#2463eb;text-decoration:none;font-size:11px}.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:13px}nav,.themes,.tools{display:flex;gap:5px;flex-wrap:wrap}.tools{margin-left:auto}button{font:inherit;padding:9px 12px;border-radius:6px;border:1px solid #dce0e4;background:white;color:#545c66;cursor:pointer}button[aria-pressed=true]{background:#24282e;border-color:#24282e;color:#fff}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #2463eb;outline-offset:3px}.hint{margin:11px 0 0;font-size:11px;color:#606773;line-height:1.6}.hint b{color:#2463eb}#stage{display:flex;gap:12px;padding:12px;flex:1;min-height:0;overflow:auto;justify-content:center}.frame{background:white;border:1px solid #cfd5dc;border-radius:9px;overflow:hidden;display:flex;flex-direction:column;width:100%;min-width:280px}.frame>p{margin:0;padding:7px 12px;background:#f8f9f7;font-size:10px;color:#606773}.frame iframe{border:0;width:100%;height:100%;flex:1;min-height:0}.before{display:none}#stage.compare .before{display:flex}#stage.mobile .frame{width:390px;flex:0 0 390px}#stage.mobile.compare .frame{flex-basis:390px}.themes button{display:flex;gap:6px;align-items:center}.dot{height:10px;width:10px;border-radius:50%;border:1px solid #aaa;display:inline-block}.dot.light{background:#f7f7f5}.dot.graphite{background:#25272a}.dot.adaptive{background:linear-gradient(90deg,#f7f7f5 50%,#25272a 50%)}@media(max-width:720px){header{padding:12px}.top strong{font-size:13px}.controls{gap:9px}.tools{margin-left:0}button{font-size:10px;padding:8px 9px}#stage{padding:5px}#stage.compare{flex-direction:column}#stage.compare .frame{height:75vh;flex-shrink:0;flex-basis:75vh;width:100%}#stage.mobile .frame{max-width:100%;flex-basis:auto}.hint{font-size:10px}}</style></head><body><header><div class="top"><strong>ϟ Kineo · uma identidade para mais mercados</strong><a href="business.html" id="open" target="_blank" rel="noopener">Abrir página inteira ↗</a></div><div class="controls"><nav aria-label="Páginas"><button data-page="business" aria-pressed="true">Business & Ads</button><button data-page="home" aria-pressed="false">Home</button><button data-page="studio" aria-pressed="false">Studio Ads</button><button data-page="library" aria-pressed="false">Library</button><button data-page="explore" aria-pressed="false">Examples</button><button data-page="guide" aria-pressed="false">Guia da identidade</button></nav><div class="themes" aria-label="Paleta"><button data-theme="light" aria-pressed="true"><i class="dot light"></i>Claro</button><button data-theme="graphite" aria-pressed="false"><i class="dot graphite"></i>Grafite</button><button data-theme="adaptive" aria-pressed="false"><i class="dot adaptive"></i>Misto</button></div><div class="tools"><button id="mobile" aria-pressed="false">Celular</button><button id="compare" aria-pressed="false">Antes / depois</button></div></div><p class="hint"><b>Minha recomendação: Claro.</b> Base neutra, azul só na assinatura e no foco. Vídeos e marcas trazem a cor. Protótipos com dados demonstrativos, sem alterar o site principal.</p></header><main id="stage"><section class="frame before"><p>Antes · página atual em 24/09</p><iframe id="before" title="Página atual" src="before-business.html" sandbox="allow-same-origin"></iframe></section><section class="frame"><p id="label">Business & Ads · proposta</p><iframe id="view" title="Proposta de identidade" src="business.html?theme=light"></iframe></section></main><script>const labels={"business":"Business & Ads","home":"Home","studio":"Studio Ads","library":"Library","explore":"Examples","guide":"Guia da identidade"};let page='business',theme='light';const view=document.getElementById('view'),before=document.getElementById('before'),stage=document.getElementById('stage'),compare=document.getElementById('compare');function show(){view.src=page+'.html?theme='+theme;document.getElementById('open').href=view.src;document.getElementById('label').textContent=labels[page]+' · proposta';document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.page===page)));document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));const hasBefore=['business','home'].includes(page);compare.disabled=!hasBefore;if(!hasBefore){stage.classList.remove('compare');compare.setAttribute('aria-pressed','false')}else before.src='before-'+page+'.html'}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;show()});document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;show()});for(const id of ['mobile','compare'])document.getElementById(id).onclick=function(){this.setAttribute('aria-pressed',String(stage.classList.toggle(id)))};window.addEventListener("message",e=>{if(e.source!==view.contentWindow||e.origin!==location.origin||e.data?.type!=="kineo-neutral-page"||!Object.hasOwn(labels,e.data.page))return;page=e.data.page;show()});</script></body></html>
