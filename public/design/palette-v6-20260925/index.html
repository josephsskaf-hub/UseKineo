<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Kineo · White & Blue</title><style>*{box-sizing:border-box}body{margin:0;background:#e8edf3;color:#27384d;font:12px system-ui,Arial}.review-bar{display:flex;align-items:center;gap:16px;padding:14px 22px;background:#fff;border-bottom:1px solid #ced9e7;flex-wrap:wrap}.review-brand{font-size:15px;font-weight:700;margin-right:auto;display:flex;align-items:center;gap:9px}.review-brand b{font-size:25px;color:#2997ff}.review-brand small{font-size:11px;color:#64748b;font-weight:400;margin-left:6px}label{display:flex;align-items:center;gap:7px;font-size:11px}select,button,.open-link{border:1px solid #cbd8e6;border-radius:8px;padding:8px 10px;background:#f8fafc;color:#34475d;font:12px system-ui;cursor:pointer}.review-note{padding:9px 22px;color:#61748a;font-size:11px;display:flex;justify-content:space-between;gap:10px}.review-note a{color:#2666b8;text-decoration:none}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 14px}.comparison.solo{grid-template-columns:1fr}.pane{min-width:0;background:#fff;border:1px solid #cbd8e6;border-radius:12px;overflow:hidden}.pane[hidden]{display:none}.pane-head{height:40px;padding:0 14px;display:flex;align-items:center;gap:9px;border-bottom:1px solid #dbe3ec;background:#f9fbfe}.pane-head h2{font-size:12px;font-weight:650;margin:0}.pane-head a{margin-left:auto;font-size:11px;color:#2871c9;text-decoration:none}.swatch{height:11px;width:11px;border:1px solid #b9c8da;border-radius:50%;background:#fff}.swatch.blue{background:#15283e;border-color:#15283e}.viewport{height:calc(100dvh - 151px);min-height:420px;overflow:hidden;background:#dce4ee;position:relative}.viewport iframe{display:block;border:0;transform-origin:top left;background:white}.offline-note{color:#7b8da0}@media(max-width:900px){.review-bar{gap:10px;padding:12px}.review-brand{width:100%;margin:0}.review-brand small{font-size:10px}.review-note{padding:8px 12px;font-size:10px}.comparison{padding:0 8px 8px;gap:8px}.pane-head{padding:0 8px}.pane-head h2{font-size:11px}.pane-head a{font-size:10px}.viewport{height:calc(100dvh - 220px);min-height:470px}}@media(max-width:580px){.comparison:not(.solo){grid-template-columns:1fr}.viewport{height:600px}.review-bar label{flex:1;min-width:125px;justify-content:space-between}.review-bar select{max-width:155px}.review-note{display:block;line-height:1.8}.review-brand small{display:block;margin-left:0}}</style></head><body><header class="review-bar"><div class="review-brand"><b>ϟ</b> Kineo <small>Refinement 06 · One palette, everywhere</small></div><label>Page<select id="page-select"><option value="home">Home</option><option value="create">Video</option><option value="image">Image</option><option value="business">For Business</option><option value="pricing">Pricing</option><option value="video">Studio · Video</option><option value="studio">Studio Ads</option><option value="library">Library</option><option value="explore">Examples</option><option value="film-ready">Film ready</option><option value="image-ready">Image ready</option><option value="animate">Image to video</option><option value="credits">Credits</option></select></label><label>View<select id="mode-select"><option value="compare">White + Blue</option><option value="light">White · full width</option><option value="blue">Blue · full width</option><option value="previous-light">Previous + White</option><option value="previous-blue">Previous + Blue</option><option value="original-light">Original + White</option><option value="original-blue">Original + Blue</option></select></label><label>Size<select id="device-select"><option value="desktop">Desktop</option><option value="mobile">Mobile</option></select></label><label>Language<select id="language-select"><option value="en">English</option><option value="pt">Português</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="nl">Nederlands</option><option value="pl">Polski</option><option value="tr">Türkçe</option><option value="ru">Русский</option><option value="uk">Українська</option><option value="ar">العربية</option><option value="ur">اردو</option><option value="hi">हिन्दी</option><option value="id">Bahasa Indonesia</option><option value="vi">Tiếng Việt</option></select></label></header><div class="review-note"><span><strong id="page-name">Home</strong> · Same layout and content in both palettes.</span><span>Visual preview · No purchases, uploads or generation.</span></div><main class="comparison" id="comparison"><section class="pane" id="left-pane"><div class="pane-head"><i class="swatch"></i><h2></h2><a href="home.html" rel="noopener">Open ↗</a></div><div class="viewport"><iframe loading="eager" title="Kineo palette"></iframe></div></section><section class="pane" id="right-pane"><div class="pane-head"><i class="swatch"></i><h2></h2><a href="home.html" rel="noopener">Open ↗</a></div><div class="viewport"><iframe loading="eager" title="Kineo palette"></iframe></div></section></main><script>
const labels={"home":"Home","create":"Video","image":"Image","business":"For Business","pricing":"Pricing","video":"Studio · Video","studio":"Studio Ads","library":"Library","explore":"Examples","film-ready":"Film ready","image-ready":"Image ready","animate":"Image to video","credits":"Credits"},pages=Object.keys(labels),pageSelect=document.getElementById('page-select'),languageSelect=document.getElementById('language-select'),modeSelect=document.getElementById('mode-select'),deviceSelect=document.getElementById('device-select');
const validLanguages=["en","pt","es","fr","de","it","nl","pl","tr","ru","uk","ar","ur","hi","id","vi"],params=new URLSearchParams(location.search);let page=pages.includes(params.get('page'))?params.get('page'):'home',lang=params.get('lang')||'en',savedAppearance='light';try{if(!params.has('lang'))lang=localStorage.getItem('kineo:interface-language:v1')||'en';if(localStorage.getItem('kineo:design-preview-appearance:v1')==='dark')savedAppearance='blue'}catch{}if(!validLanguages.includes(lang))lang='en';let mode=['compare','light','blue','previous-light','previous-blue','original-light','original-blue'].includes(params.get('mode'))?params.get('mode'):savedAppearance,device=params.get('device')==='mobile'?'mobile':'desktop';
pageSelect.value=page;languageSelect.value=lang;modeSelect.value=mode;deviceSelect.value=device;
const panes=[document.getElementById('left-pane'),document.getElementById('right-pane')];
function pageFile(type){return(type==='previous'?'previous-':type==='original'&&['home','business'].includes(page)?'before-':type==='original'?'previous-':'')+page+'.html'}
function scale(){const width=device==='mobile'?390:1440;panes.filter(p=>!p.hidden).forEach(p=>{const v=p.querySelector('.viewport'),f=p.querySelector('iframe'),s=Math.min(v.clientWidth/width,1);f.style.width=width+'px';f.style.height=Math.ceil(v.clientHeight/s)+'px';f.style.transform='scale('+s+')';f.style.marginLeft=Math.max(0,(v.clientWidth-width*s)/2)+'px'})}
function render(hash=''){const types=mode==='compare'?['light','blue']:mode.startsWith('previous-')?['previous',mode.slice(9)]:mode.startsWith('original-')?['original',mode.slice(9)]:[mode];document.getElementById('comparison').classList.toggle('solo',types.length===1);panes.forEach((p,i)=>{const type=types[i];p.hidden=!type;if(!type)return;const theme=['light','blue'].includes(type)?type:'adaptive',file=pageFile(type),url=file+'?theme='+theme+'&lang='+lang+(hash||'');p.querySelector('h2').textContent=type==='light'?'01 · White':type==='blue'?'02 · Blue':type==='original'?'Original site':'Previous · Mixed';p.querySelector('.swatch').className='swatch'+(type==='blue'?' blue':'');const a=p.querySelector('a');a.href=url;a.target='_blank';const f=p.querySelector('iframe');f.title=p.querySelector('h2').textContent+' · '+labels[page];if(window.KINEO_OFFLINE)window.loadOffline(f,file,theme,lang,hash);else f.src=url});scale();document.getElementById('page-name').textContent=labels[page];try{if(location.protocol!=='file:'){const u=new URL(location.href);u.searchParams.set('page',page);u.searchParams.set('lang',lang);u.searchParams.set('mode',mode);u.searchParams.set('device',device);history.replaceState({},'',u)}}catch{}}
function shareLanguage(){panes.forEach(p=>p.querySelector('iframe').contentWindow.postMessage({type:'kineo-set-language',lang},'*'));try{localStorage.setItem('kineo:interface-language:v1',lang);if(location.protocol!=='file:'){const u=new URL(location.href);u.searchParams.set('lang',lang);history.replaceState({},'',u)}}catch{}panes.forEach(p=>{const a=p.querySelector('a'),u=new URL(a.href);u.searchParams.set('lang',lang);a.href=u.href})}
pageSelect.onchange=()=>{page=pageSelect.value;render()};languageSelect.onchange=()=>{lang=languageSelect.value;shareLanguage()};modeSelect.onchange=()=>{mode=modeSelect.value;render()};deviceSelect.onchange=()=>{device=deviceSelect.value;scale()};new ResizeObserver(scale).observe(document.getElementById('comparison'));
window.addEventListener('message',e=>{const activePane=panes.find(p=>p.querySelector('iframe').contentWindow===e.source);if(!activePane)return;if(e.data?.type==='kineo-neutral-page'&&pages.includes(e.data.page)){page=e.data.page;pageSelect.value=page;render(e.data.hash||'')}if(e.data?.type==='kineo-language'&&validLanguages.includes(e.data.lang)){lang=e.data.lang;languageSelect.value=lang;shareLanguage()}if(e.data?.type==='kineo-appearance'&&['light','blue'].includes(e.data.theme)){mode=e.data.theme;modeSelect.value=mode;document.getElementById('comparison').classList.add('solo');panes.forEach(p=>p.hidden=p!==activePane);activePane.querySelector('h2').textContent=mode==='light'?'01 · Light':'02 · Dark';activePane.querySelector('.swatch').className='swatch'+(mode==='blue'?' blue':'');const a=activePane.querySelector('a'),url=new URL(a.href);url.searchParams.set('theme','saved');a.href=url.href;try{localStorage.setItem('kineo:design-preview-appearance:v1',mode==='light'?'light':'dark');if(location.protocol!=='file:'){const u=new URL(location.href);u.searchParams.set('mode',mode);history.replaceState({},'',u)}}catch{}scale()}});render();
</script></body></html>
