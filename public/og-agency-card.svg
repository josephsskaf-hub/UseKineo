<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Kineo AI Shorts for businesses</title>
  <desc id="desc">Kineo creates vertical videos with script, voice, visuals and captions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.58" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#071611"/>
    </linearGradient>
    <linearGradient id="panelA" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2997ff"/>
      <stop offset="1" stop-color="#6d5dfc"/>
    </linearGradient>
    <linearGradient id="panelB" x1="0" y1="1" x2="1" y2="0">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#0c7dd9"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="36"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <circle cx="1020" cy="70" r="210" fill="#2997ff" opacity=".18" filter="url(#glow)"/>
  <circle cx="980" cy="570" r="180" fill="#34d399" opacity=".15" filter="url(#glow)"/>

  <g transform="translate(72 67)">
    <rect width="174" height="48" rx="24" fill="#11151d" stroke="#2f3746"/>
    <path d="M25 15h13l-6 9h8L25 39l4-11h-8z" fill="#fbbf24"/>
    <text x="54" y="32" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="900" letter-spacing="1.4">KINEO</text>
  </g>

  <text x="72" y="208" fill="#34d399" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="4">AI VIDEO PRODUCTION</text>
  <text x="72" y="282" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="950" letter-spacing="-2.2">10–30 AI SHORTS</text>
  <text x="72" y="344" fill="#ffffff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="950" letter-spacing="-2.2">FOR YOUR BUSINESS</text>
  <text x="74" y="405" fill="#aeb4c0" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="600">TikTok · Reels · YouTube Shorts</text>

  <g transform="translate(72 472)">
    <rect width="585" height="70" rx="18" fill="#10141b" stroke="#2b3340"/>
    <text x="25" y="44" fill="#e8ebf0" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="750">SCRIPT  ·  VOICE  ·  VISUALS  ·  CAPTIONS</text>
  </g>

  <g transform="translate(840 72) scale(.85)">
    <g transform="rotate(-7 125 250)">
      <rect x="0" y="0" width="250" height="500" rx="36" fill="#0b0e14" stroke="#354052" stroke-width="4"/>
      <rect x="14" y="14" width="222" height="472" rx="26" fill="url(#panelA)"/>
      <circle cx="125" cy="165" r="72" fill="#0a1020" opacity=".62"/>
      <path d="M68 328c31-91 83-143 155-158v194H68z" fill="#ffffff" opacity=".18"/>
      <rect x="42" y="386" width="166" height="12" rx="6" fill="#ffffff" opacity=".96"/>
      <rect x="62" y="410" width="126" height="10" rx="5" fill="#ffffff" opacity=".72"/>
    </g>
    <g transform="translate(180 20) rotate(7 115 235)">
      <rect x="0" y="0" width="230" height="470" rx="34" fill="#0b0e14" stroke="#354052" stroke-width="4"/>
      <rect x="14" y="14" width="202" height="442" rx="25" fill="url(#panelB)"/>
      <path d="M39 278c38-101 101-154 174-168v218H39z" fill="#05140e" opacity=".42"/>
      <circle cx="118" cy="145" r="60" fill="#f5f5f7" opacity=".18"/>
      <rect x="41" y="365" width="150" height="11" rx="6" fill="#ffffff" opacity=".96"/>
      <rect x="61" y="388" width="110" height="9" rx="5" fill="#ffffff" opacity=".72"/>
    </g>
  </g>
</svg>
